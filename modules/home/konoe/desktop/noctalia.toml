[audio]
enable_overdrive = true

[bar.default]
capsule_thickness = 0.52999999187886715
padding = 15
widget_spacing = 15

[calendar]
enabled = true

[config]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
launch_apps_custom_command = "nvidia-offload $CMD"
niri_overview_type_to_launch_enabled = true

    [shell.panel]
    border_width = 1.5
    launcher_placement = "attached"
    list_item_background = true

    [shell.screenshot]
    confirm_region = true

[templates]

[theme]
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "alacritty", "niri" ]
    community_ids = [ "zen-browser", "vscode" ]

[wallpaper.default]
path = "/home/konoe/Pictures/Wallpapers/night-anime-vehicle-blue-waiting-Shinigami-no-Testament-724040-wallhere.com.jpg"

[wallpaper.last]
path = "/home/konoe/Pictures/Wallpapers/night-anime-vehicle-blue-waiting-Shinigami-no-Testament-724040-wallhere.com.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/konoe/Pictures/Wallpapers/night-anime-vehicle-blue-waiting-Shinigami-no-Testament-724040-wallhere.com.jpg"
