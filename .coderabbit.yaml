# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

enable_free_tier: true

reviews:
  profile: assertive
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  high_level_summary: true
  collapse_walkthrough: true
  suggested_reviewers: false
  auto_assign_reviewers: false
  assess_linked_issues: false
  related_prs: true
  request_changes_workflow: false

  path_filters:
    - "!flake.lock"

  path_instructions:
    - path: "modules/**/*.nix"
      instructions: |
        This repository uses the Dendritic flake-parts pattern with import-tree.

        Module namespaces are declared in modules/parts.nix:
        - flake.custom.serpentine: Serpentine system modules.
        - flake.custom.tanuki: Tanuki system modules.
        - flake.custom.alice: Alice Home Manager modules.
        - flake.custom.konoe: Konoe Home Manager modules.
        - flake.custom.home-common: Shared Home Manager modules.
        - flake.custom.commonModules: Shared NixOS modules.
        - flake.custom.hardwareModules: Hardware and driver modules.
        - flake.custom.system-modules: Modules for non-NixOS systems.

        - Place module outputs in the namespace matching their responsibility.
        - Use unique attribute names within each namespace.
        - flake.nixosModules and flake.homeModules are valid top-level
          namespaces for reusable NixOS and Home Manager module exports.
        - Do not confuse host-specific modules with reusable module exports.
        - Keep NixOS and Home Manager module responsibilities separate.
        - Host configuration files are composition points. They may
          intentionally import NixOS and Home Manager modules into their
          respective configuration scopes.
        - Do not use lib.mkIf inside imports lists. Use appropriate
          conditional imports instead. lib.mkIf remains valid for conditional configuration.
        - self must be closed over from the outer flake-parts scope,
          not assumed to exist inside nested NixOS module lambdas.
        - Wrapped packages must use
          self.packages.${pkgs.stdenv.hostPlatform.system}.<name>.

    - path: "flake.nix"
      instructions: |
        flake.nix must remain minimal: inputs + mkFlake only.
        Flag any module wiring, imports, or logic added directly here.
    - path: "scripts/**"
      instructions: |
        Shell scripts should be POSIX-compatible where possible.
        Flag bashisms if the shebang is /usr/bin/env sh.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "chore"
    base_branches:
      - "test-den"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: false
    markdownlint:
      enabled: true

chat:
  art: false
  auto_reply: false
