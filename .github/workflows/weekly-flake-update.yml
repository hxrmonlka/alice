name: Weekly nix flake update

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-and-validate:
    name: Update flake.lock and evaluate hosts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: test-den
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Update flake lock
        run: |
          set -euo pipefail
          nix flake update

      - name: Evaluate serpentine (post-update)
        run: |
          set -euo pipefail
          echo "==> Evaluating nixosConfigurations.serpentine after lock update"
          nix path-info --derivation \
            .#nixosConfigurations.serpentine.config.system.build.toplevel

      - name: Evaluate tanuki (post-update)
        run: |
          set -euo pipefail
          echo "==> Evaluating nixosConfigurations.tanuki after lock update"
          nix path-info --derivation \
            .#nixosConfigurations.tanuki.config.system.build.toplevel

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake.lock"
          title: "chore: weekly flake.lock update"
          body: |
            Automated weekly update of `flake.lock`.

            Host evaluation for `serpentine` and `tanuki` already passed on this
            branch before the PR was opened. CI will re-run on the PR as well.
          branch: ci/weekly-flake-update
          base: test-den
          delete-branch: true
          force: false
