name: Weekly nix flake update

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-and-validate:
    name: Update flake.lock and evaluate all outputs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: test-den
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            max-jobs = auto

      - name: Update flake lock
        run: |
          set -euo pipefail
          nix flake update

      - name: Evaluate all NixOS system derivations
        run: |
          set -euo pipefail
          hosts="$(nix eval --json .#nixosConfigurations --apply 'builtins.attrNames' | jq -r '.[]')"
          test -n "${hosts}"
          while IFS= read -r host; do
            echo "==> Evaluating nixosConfigurations.${host} after lock update"
            nix path-info --derivation ".#nixosConfigurations.\"${host}\".config.system.build.toplevel"
          done <<< "${hosts}"

      - name: Evaluate all Home Manager derivations
        run: |
          set -euo pipefail
          homes="$(nix eval --json .#homeConfigurations --apply 'builtins.attrNames' | jq -r '.[]')"
          test -n "${homes}"
          while IFS= read -r home; do
            echo "==> Evaluating homeConfigurations.${home} after lock update"
            nix path-info --derivation ".#homeConfigurations.\"${home}\".activationPackage"
          done <<< "${homes}"

      - name: Flake check (non-build)
        run: |
          set -euo pipefail
          nix flake check --no-build --print-build-logs

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake.lock"
          title: "chore: weekly flake.lock update"
          body: |
            Automated weekly update of `flake.lock`.

            All NixOS system derivations, Home Manager activation derivations,
            and `nix flake check --no-build` passed before this PR was opened.
          branch: ci/weekly-flake-update
          base: test-den
          delete-branch: true
          force: false
